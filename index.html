<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Meera ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:white;
  text-align:center;
  background:linear-gradient(135deg,#16001f,#70002f,#ff416c);
}

.container{
  width:92%;
  max-width:650px;
  padding:35px 22px;
  border-radius:30px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(15px);
  box-shadow:0 0 40px rgba(255,0,100,.4);
}

.heart{
  font-size:65px;
  animation:beat 1.2s infinite;
}

@keyframes beat{
  50%{transform:scale(1.2)}
}

h1{
  font-size:clamp(45px,13vw,85px);
  letter-spacing:8px;
  text-shadow:
  0 0 10px white,
  0 0 25px #ff4d88,
  0 0 50px #ff0066;
  animation:glow 2s infinite alternate;
}

@keyframes glow{
  from{filter:brightness(1)}
  to{filter:brightness(1.5)}
}

h2{
  margin:15px 0;
}

p{
  font-size:18px;
  line-height:1.7;
  margin:15px 0;
}

.buttons{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-top:25px;
}

button{
  padding:15px;
  border:none;
  border-radius:30px;
  background:white;
  color:#d60055;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  transform:scale(1.05);
  box-shadow:0 0 20px white;
}

#message{
  margin-top:25px;
  min-height:60px;
  font-size:20px;
  font-weight:bold;
  color:#ffe1eb;
}

.hidden{
  display:none;
}

.final{
  font-size:24px;
  line-height:1.8;
  animation:appear 1s ease;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.7);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.floating{
  position:fixed;
  bottom:-40px;
  animation:float 7s linear forwards;
  pointer-events:none;
}

@keyframes float{
  to{
    transform:translateY(-110vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="heart">❤️</div>

  <h1>MEERA</h1>

  <h2>💌 I Have A Question For You...</h2>

  <p>
    Before you continue, you have to make some choices. 😏❤️
  </p>

  <div id="question1">

    <p>
      <b>What do you think you are to me?</b> ❤️
    </p>

    <div class="buttons">

      <button onclick="answer1('wrong')">
        Just a friend 😅
      </button>

      <button onclick="answer1('right')">
        Someone very special ❤️
      </button>

      <button onclick="answer1('love')">
        The love of your life? 🥹💕
      </button>

    </div>

  </div>


  <div id="question2" class="hidden">

    <p>
      <b>Choose one thing you want from me...</b> 💕
    </p>

    <div class="buttons">

      <button onclick="answer2('hug')">
        A big hug 🤗
      </button>

      <button onclick="answer2('love')">
        Unlimited love ❤️
      </button>

      <button onclick="answer2('forever')">
        Forever together 💍
      </button>

    </div>

  </div>


  <div id="question3" class="hidden">

    <p>
      <b>One last choice...</b> 👀❤️
    </p>

    <p>
      Will you keep me in your heart?
    </p>

    <div class="buttons">

      <button onclick="finish()">
        YES ❤️
      </button>

      <button onclick="finish()">
        OF COURSE ❤️
      </button>

      <button onclick="finish()">
        ALWAYS 💍❤️
      </button>

    </div>

  </div>


  <div id="message"></div>

</div>


<script>

function answer1(choice){

  document.getElementById("question1")
  .classList.add("hidden");

  document.getElementById("question2")
  .classList.remove("hidden");

  const message =
    document.getElementById("message");

  if(choice === "wrong"){
    message.innerHTML =
      "Nice try 😂 But you are MUCH more than that. ❤️";
  }

  else if(choice === "right"){
    message.innerHTML =
      "Exactly... but I think you're even more special. 🥹❤️";
  }

  else{
    message.innerHTML =
      "You already know my heart. 😭❤️";
  }

}


function answer2(choice){

  document.getElementById("question2")
  .classList.add("hidden");

  document.getElementById("question3")
  .classList.remove("hidden");

  const message =
    document.getElementById("message");

  if(choice === "hug"){
    message.innerHTML =
      "Then come here... 🤗❤️";
  }

  else if(choice === "love"){
    message.innerHTML =
      "That one is easy. You already have it. ❤️";
  }

  else{
    message.innerHTML =
      "Forever sounds perfect to me. 💍❤️";
  }

}


function finish(){

  document.getElementById("question3")
  .classList.add("hidden");

  document.getElementById("message")
  .innerHTML = `

    <div class="final">

      ❤️ MEERA ❤️

      <br><br>

      You made it to the end...

      <br><br>

      But here's the truth:

      <br><br>

      I don't need a website to tell you
      how much I love you.

      <br><br>

      I just wanted to create something
      special that reminds you...

      <br><br>

      <b>YOU ARE LOVED. ❤️</b>

      <br><br>

      And if I had to choose again...

      <br>

      <b>I WOULD STILL CHOOSE YOU. 💕</b>

      <br><br>

      Forever yours. ❤️

    </div>

  `;

  createHearts();

}


function createHearts(){

  for(let i=0;i<40;i++){

    const heart =
      document.createElement("div");

    heart.className="floating";

    heart.innerHTML =
      ["❤️","💖","💕","💗","💓","✨"]
      [Math.floor(Math.random()*6)];

    heart.style.left =
      Math.random()*100+"vw";

    heart.style.fontSize =
      Math.random()*25+15+"px";

    heart.style.animationDuration =
      Math.random()*4+4+"s";

    document.body.appendChild(heart);

    setTimeout(()=>{
      heart.remove();
    },8000);

  }

}

</script>

</body>
</html>
